<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Civics — 2025 U.S. Citizenship Test</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Civics">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icon-192.png">
<link rel="apple-touch-icon" href="static/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#09090b; --bg-surface:#0f1117; --bg-card:#161922; --bg-elevated:#1c2030; --bg-input:#0d1019;
  --text-primary:#f0f2f5; --text-secondary:#8b95a8; --text-muted:#5a6478; --text-disabled:#3d4555;
  --border-subtle:rgba(255,255,255,0.05); --border-default:#1e2433; --border-hover:#2a3247;
  --accent:#0d9488; --accent-hover:#0f766e; --accent-light:#2dd4bf; --accent-muted:rgba(13,148,136,0.12);
  --sec:#9B2C2C; --sec-light:#C05252; --sec-muted:rgba(155,44,44,0.14);
  --success:#10b981; --success-muted:rgba(16,185,129,0.12);
  --warning:#f59e0b; --warning-muted:rgba(245,158,11,0.12);
  --error:#ef4444; --error-muted:rgba(239,68,68,0.12);
  --shadow-card:0 2px 8px rgba(13,148,136,0.06), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-elev:0 8px 24px rgba(13,148,136,0.1), 0 2px 6px rgba(0,0,0,0.25);
  --snappy:cubic-bezier(0.22,1,0.36,1);
  --smooth:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="light"]{
  --bg-base:#fafaf8; --bg-surface:#f5f4f1; --bg-card:#ffffff; --bg-elevated:#ffffff; --bg-input:#ffffff;
  --text-primary:#18181b; --text-secondary:#52525b; --text-muted:#a1a1aa; --text-disabled:#d4d4d8;
  --border-subtle:#eeece7; --border-default:#e5e3de; --border-hover:#d1cec7;
  --shadow-card:0 2px 8px rgba(10,22,40,0.08), 0 1px 2px rgba(10,22,40,0.04);
  --shadow-elev:0 12px 40px rgba(10,22,40,0.12), 0 2px 6px rgba(10,22,40,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Inter','Inter Variable',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-feature-settings:"cv01";
  background:var(--bg-base);color:var(--text-primary);
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%, var(--bg-surface) 0%, var(--bg-base) 62%)}
[data-theme="light"] body::after{opacity:.7}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-feature-settings:"cv01"}
input,select{font:inherit;font-feature-settings:"cv01"}
svg{display:block;flex:0 0 auto}

#app{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;
  max-width:520px;width:100%;margin:0 auto;overflow:hidden}
.appbar{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.wordmark{display:flex;align-items:center;gap:9px}
.seal{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--sec),#6d1f1f);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#f4dede;
  border-top:1px solid rgba(255,255,255,.14)}
.wordmark h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
.icobtn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);border:1px solid var(--border-subtle);background:var(--bg-card);
  transition:all 120ms var(--snappy)}
.icobtn:active{background:var(--bg-elevated);transform:scale(.94)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 24px}
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--border-subtle);
  background:var(--bg-surface);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:60px;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-muted);transition:color 120ms var(--snappy)}
.tab.on{color:var(--accent-light)}
[data-theme="light"] .tab.on{color:var(--accent)}

.micro{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted)}
.card{background:var(--bg-card);border:1px solid var(--border-subtle);border-top:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:20px;box-shadow:var(--shadow-card)}
[data-theme="light"] .card{border-top-color:var(--border-default)}
.btn{width:100%;height:50px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:500;letter-spacing:-.1px;transition:all 120ms var(--snappy)}
.btn:active{transform:scale(.985)}
.btn.teal{background:linear-gradient(135deg,#0d9488,#10b981);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--border-default);color:var(--text-secondary)}
.btn.good{background:var(--success);color:#04231a}
.btn.small{height:44px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:9px}
.fade{animation:fade 260ms var(--smooth)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop{animation:pop 340ms var(--snappy)}
@keyframes pop{0%{transform:scale(.86);opacity:0}60%{transform:scale(1.03)}100%{transform:none;opacity:1}}

/* HOME */
.ringwrap{display:flex;align-items:center;gap:18px}
.ringtxt h2{font-size:17px;font-weight:500;letter-spacing:-.2px;line-height:1.3}
.ringtxt p{font-size:13px;color:var(--text-secondary);margin-top:5px;line-height:1.45}
.pillrow{display:flex;gap:8px;margin-top:14px}
.pill{flex:1;background:var(--bg-card);border:1px solid var(--border-subtle);border-top:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:11px 8px;text-align:center;box-shadow:var(--shadow-card)}
[data-theme="light"] .pill{border-top-color:var(--border-default)}
.pill .v{font-size:18px;font-weight:500;letter-spacing:-.3px;font-feature-settings:"cv01","tnum";
  display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.15}
.pill .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-top:4px}
.modecard{display:flex;align-items:center;gap:14px;background:var(--bg-card);border:1px solid var(--border-subtle);
  border-top:1px solid rgba(255,255,255,.08);border-radius:10px;padding:15px 16px;box-shadow:var(--shadow-card);
  margin-bottom:9px;width:100%;text-align:left;transition:all 160ms var(--snappy)}
[data-theme="light"] .modecard{border-top-color:var(--border-default)}
.modecard:active{transform:scale(.99);background:var(--bg-elevated)}
.modecard.primary{background:linear-gradient(135deg,rgba(13,148,136,.16),rgba(13,148,136,.05));border-color:rgba(13,148,136,.3)}
.mi{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--accent-muted);color:var(--accent-light)}
[data-theme="light"] .mi{color:var(--accent)}
.mi.sec{background:var(--sec-muted);color:var(--sec-light)}
.mi.neutral{background:rgba(120,130,150,.12);color:var(--text-secondary)}
.mt{flex:1;min-width:0}
.mt h4{font-size:15px;font-weight:500;letter-spacing:-.1px}
.mt p{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.4}
.weakrow{display:flex;align-items:center;gap:10px;margin-top:9px}
.weakname{font-size:12px;color:var(--text-secondary);flex:0 0 138px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:5px;border-radius:9999px;background:rgba(120,130,150,.16);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9999px;transition:width 500ms var(--smooth)}
.weakpct{font-size:11px;font-weight:500;color:var(--text-muted);flex:0 0 32px;text-align:right;font-feature-settings:"cv01","tnum"}

/* QUIZ SHARED */
.hud{display:flex;align-items:center;justify-content:space-between;padding:2px 0 11px}
.hearts{display:flex;gap:5px}
.chip{display:flex;align-items:center;gap:5px;border-radius:9999px;padding:4px 10px;
  font-size:12px;font-weight:600;font-feature-settings:"cv01","tnum"}
.chip.flame{background:var(--warning-muted);color:var(--warning)}
.chip.xp{background:rgba(120,130,150,.12);color:var(--text-secondary);font-weight:500}
.timer{height:4px;border-radius:9999px;background:rgba(120,130,150,.16);overflow:hidden;margin-bottom:18px}
.timer i{display:block;height:100%;border-radius:9999px;background:linear-gradient(90deg,var(--accent),var(--accent-light));
  transition:width 250ms linear}
.timer i.low{background:linear-gradient(90deg,#ef4444,#f59e0b)}
.qtag{display:inline-block;background:var(--sec-muted);color:var(--sec-light);border-radius:9999px;padding:3px 9px;
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:11px}
.qtext{font-size:22px;font-weight:500;line-height:1.28;letter-spacing:-.4px}
.qsub{font-size:12.5px;color:var(--text-muted);margin-top:7px;line-height:1.45}
.opts{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.opt{background:var(--bg-card);border:1px solid var(--border-default);border-top:1px solid rgba(255,255,255,.07);
  border-radius:10px;padding:14px 15px;font-size:14px;line-height:1.4;color:var(--text-primary);
  display:flex;align-items:center;gap:11px;box-shadow:var(--shadow-card);width:100%;text-align:left;
  transition:all 140ms var(--snappy)}
[data-theme="light"] .opt{border-top-color:var(--border-default)}
.opt:active{transform:scale(.99)}
.opt .key{width:21px;height:21px;border-radius:6px;flex:0 0 21px;background:rgba(120,130,150,.14);color:var(--text-muted);
  font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.opt.right{background:linear-gradient(135deg,rgba(16,185,129,.16),rgba(16,185,129,.06));border-color:rgba(16,185,129,.42)}
.opt.right .key{background:var(--success);color:#04231a}
.opt.chosen-wrong{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
.opt.chosen-wrong .key{background:var(--error);color:#fff}
.opt.dim{opacity:.42}
.opt.sel{border-color:var(--accent);background:var(--accent-muted)}
.opt.sel .key{background:var(--accent);color:#fff}
.feedback{margin-top:15px;border-radius:10px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.feedback.ok{background:var(--success-muted);border:1px solid rgba(16,185,129,.22)}
.feedback.no{background:var(--error-muted);border:1px solid rgba(239,68,68,.22)}
.feedback .t{font-size:13px;font-weight:500}
.feedback.ok .t{color:var(--success)}
.feedback.no .t{color:var(--error)}
.feedback .d{font-size:12px;color:var(--text-secondary);line-height:1.45;margin-top:3px}
.story{margin-top:11px;border-radius:10px;padding:15px 16px;
  background:linear-gradient(135deg,rgba(155,44,44,.15),rgba(155,44,44,.05));border:1px solid rgba(155,44,44,.3)}
.story .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sec-light);
  display:flex;align-items:center;gap:6px;margin-bottom:8px}
.story p{font-size:13px;line-height:1.58;color:var(--text-primary)}
.story p+p{margin-top:9px;color:var(--text-secondary)}
[data-theme="light"] .story p{color:#3f3f46}
[data-theme="light"] .story p+p{color:#52525b}

/* EXAM */
.pips{display:flex;gap:3px;margin:4px 0 14px}
.pip{flex:1;height:5px;border-radius:9999px;background:rgba(120,130,150,.16);transition:background 240ms var(--snappy)}
.pip.ok{background:var(--success)}
.pip.no{background:var(--error)}
.pip.now{background:var(--accent-light)}
.tally{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;gap:10px}
.tally .big{font-size:15px;font-weight:500;letter-spacing:-.1px}
.tally .big b{color:var(--success);font-weight:600;font-feature-settings:"cv01","tnum"}
.tally .big s{color:var(--error);font-weight:600;text-decoration:none;font-feature-settings:"cv01","tnum"}
.revealbox{margin-top:18px;background:var(--bg-card);border:1px solid var(--border-subtle);
  border-top:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px;box-shadow:var(--shadow-card)}
[data-theme="light"] .revealbox{border-top-color:var(--border-default)}
.revealbox ul{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:8px}
.revealbox li{font-size:14px;line-height:1.42;display:flex;gap:9px;align-items:flex-start}
.revealbox li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:7px;flex:0 0 5px}
.hint{font-size:12px;color:var(--text-muted);text-align:center;margin-top:13px;line-height:1.5}

/* RESULT */
.verdict{text-align:center;padding:14px 0 4px}
.stamp{width:96px;height:96px;border-radius:50%;margin:0 auto 15px;display:flex;align-items:center;justify-content:center}
.stamp.pass{background:radial-gradient(circle at 50% 35%, rgba(16,185,129,.22), rgba(16,185,129,.06));
  border:2px solid rgba(16,185,129,.45);box-shadow:0 0 0 8px rgba(16,185,129,.06)}
.stamp.fail{background:radial-gradient(circle at 50% 35%, rgba(239,68,68,.2), rgba(239,68,68,.05));
  border:2px solid rgba(239,68,68,.42);box-shadow:0 0 0 8px rgba(239,68,68,.05)}
.stamp span{font-size:25px;font-weight:600;letter-spacing:-.5px}
.stamp.pass span{color:var(--success)}
.stamp.fail span{color:var(--error)}
.verdict h2{font-size:26px;font-weight:600;letter-spacing:-.6px;line-height:1.15}
.verdict p{font-size:14px;color:var(--text-secondary);margin-top:9px;line-height:1.5;padding:0 8px}
.scoreline{display:flex;gap:9px;margin:18px 0 14px}
.scorebox{flex:1;background:var(--bg-card);border:1px solid var(--border-subtle);border-top:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:13px 8px;text-align:center;box-shadow:var(--shadow-card)}
[data-theme="light"] .scorebox{border-top-color:var(--border-default)}
.scorebox .v{font-size:24px;font-weight:500;letter-spacing:-.5px;font-feature-settings:"cv01","tnum"}
.scorebox .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-top:3px}
.missrow{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border-subtle)}
.missrow:last-child{border-bottom:none;padding-bottom:0}
.missn{font-size:11px;font-weight:600;color:var(--error);background:var(--error-muted);border-radius:5px;
  padding:2px 6px;font-feature-settings:"cv01","tnum";flex:0 0 30px;text-align:center}
.missq{font-size:13px;line-height:1.42;color:var(--text-secondary)}

/* STUDY */
.search{height:42px;border-radius:8px;background:var(--bg-input);border:1px solid var(--border-default);
  display:flex;align-items:center;gap:9px;padding:0 12px;margin-bottom:14px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text-primary);font-size:15px}
.search input::placeholder{color:var(--text-muted)}
.catrow{background:var(--bg-card);border:1px solid var(--border-subtle);border-top:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:14px 15px;margin-bottom:8px;box-shadow:var(--shadow-card);width:100%;text-align:left}
[data-theme="light"] .catrow{border-top-color:var(--border-default)}
.catrow .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.catrow h4{font-size:14px;font-weight:500;letter-spacing:-.1px}
.catcount{font-size:11px;font-weight:500;color:var(--text-muted);font-feature-settings:"cv01","tnum"}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border-subtle);
  width:100%;text-align:left}
.qrow:last-child{border-bottom:none;padding-bottom:2px}
.mdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:5px}
.qn{font-size:11px;font-weight:600;color:var(--text-disabled);flex:0 0 24px;font-feature-settings:"cv01","tnum";margin-top:2px}
.qq{font-size:13px;line-height:1.42;color:var(--text-primary)}
.qa{font-size:12px;line-height:1.42;color:var(--text-muted);margin-top:3px}
.star{color:var(--warning);font-size:10px}
.note{margin-top:14px;background:var(--warning-muted);border:1px solid rgba(245,158,11,.2);border-radius:8px;
  padding:11px 13px;font-size:11.5px;line-height:1.5;color:var(--warning);display:flex;gap:8px;align-items:flex-start}
.storytag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--sec-light);
  background:var(--sec-muted);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}

/* SETTINGS */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px}
.field input,.field select{width:100%;height:42px;border-radius:8px;background:var(--bg-input);
  border:1px solid var(--border-default);padding:0 12px;color:var(--text-primary);font-size:15px;outline:none;
  transition:all 200ms var(--snappy)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(13,148,136,.2)}
.seg{display:flex;gap:6px;background:var(--bg-input);border:1px solid var(--border-default);border-radius:8px;padding:4px}
.seg button{flex:1;height:34px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-secondary);
  transition:all 120ms var(--snappy)}
.seg button.on{background:var(--accent);color:#fff}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--bg-elevated);border:1px solid var(--border-hover);border-radius:9999px;padding:9px 18px;
  font-size:13px;font-weight:500;box-shadow:var(--shadow-elev);z-index:50;animation:fade 200ms var(--snappy)}
</style>
</head>
<body>
<div id="app">
  <div class="appbar" id="appbar"></div>
  <main id="main"></main>
  <div class="tabbar" id="tabbar"></div>
</div>

<script>
"use strict";
/* ============================================================================
   CIVICS — practice app for the 2025 USCIS naturalization civics test.
   Question bank: all 128 items transcribed verbatim from USCIS M-1778 (09/25).
   Officeholder answers verified against uscis.gov/citizenship/testupdates
   on 2026-08-02. No network calls at runtime; all state in localStorage.
   ========================================================================== */

var VERIFIED_ON = "2026-08-02";

/* --- categories, derived from the official ID ranges in the PDF ---------- */
var CATS = [
  {k:"pag", lo:1,   hi:15,  group:"American Government",  name:"Principles of American Government"},
  {k:"sog", lo:16,  hi:62,  group:"American Government",  name:"System of Government"},
  {k:"rr",  lo:63,  hi:72,  group:"American Government",  name:"Rights and Responsibilities"},
  {k:"col", lo:73,  hi:89,  group:"American History",     name:"Colonial Period and Independence"},
  {k:"h19", lo:90,  hi:99,  group:"American History",     name:"The 1800s"},
  {k:"rec", lo:100, hi:118, group:"American History",     name:"Recent American History"},
  {k:"sym", lo:119, hi:124, group:"Symbols and Holidays", name:"Symbols"},
  {k:"hol", lo:125, hi:128, group:"Symbols and Holidays", name:"Holidays"}
];
function catOf(id){ for(var i=0;i<CATS.length;i++){ if(id>=CATS[i].lo && id<=CATS[i].hi) return CATS[i]; } return CATS[0]; }

/* The 20 asterisked questions (65/20 special consideration) */
var STAR = [2,7,12,20,30,36,38,39,44,52,61,66,74,78,86,94,113,115,121,126];

/* Questions whose answer depends on the applicant's state or district */
var VARIES = {23:"senators", 29:"rep", 61:"governor", 62:"capital"};

/* Questions requiring more than one answer: id -> how many */
var NEED = {10:2, 48:2, 65:3, 67:2, 69:2, 81:5, 126:3};

/* --- the 128 questions: [id, question, [accepted answers]] --------------- */
var RAW = [
[1,"What is the form of government of the United States?",["Republic","Constitution-based federal republic","Representative democracy"]],

var STORY = {
4:["“We the People” was a late edit. The first draft opened by listing the states one by one — “We the People of the States of New Hampshire, Massachusetts…”",
   "Gouverneur Morris cut the list during final styling. Nobody knew which states would actually ratify, so naming them was risky drafting.",
   "The accident is the whole idea: the government draws its authority from people, not from states."],
7:["Twenty-seven, and the most recent one waited 202 years. Madison proposed it in 1789 — Congress can't give itself a pay raise that takes effect before the next election. It fell short and sat dormant.",
   "In 1982 a University of Texas sophomore named Gregory Watson wrote a paper arguing it was still technically pending. He got a C.",
   "He spent the next decade writing to state legislatures. It was ratified in 1992 as the 27th Amendment. The professor later changed his grade to an A."],
14:["The Articles of Confederation are on this list because they failed. The first American government couldn't tax, couldn't raise an army, and needed all 13 states to agree to change anything.",
    "The Constitution is essentially a list of corrections to it.",
    "The Iroquois Great Law of Peace is also accepted — Congress passed a resolution in 1988 acknowledging the Confederacy's influence on the framers, though historians still argue about how much."],
15:["The framers weren't designing for good leaders. They were designing for bad ones.",
    "Madison's argument in Federalist 51: “If men were angels, no government would be necessary.” Since they aren't, you set ambition against ambition and let the branches check each other out of self-interest.",
    "It's a system built to survive the people running it."],
26:["Two years is short on purpose. The House was meant to be the chamber that flinches — close enough to an election that it has to listen.",
    "The Senate got six-year terms as the counterweight, to be able to ignore a bad mood.",
    "Jefferson supposedly explained it to Washington by pouring tea into a saucer to cool: the Senate is the saucer."],
28:["The Constitutional Convention nearly collapsed over this. Big states wanted representation by population; small states wanted one state, one vote — and threatened to walk out and form their own union if they didn't get it.",
    "Roger Sherman of Connecticut broke the deadlock: one chamber by population, one chamber equal. Nobody got what they wanted, which is why it worked.",
    "The consequence is still live. Wyoming's roughly 580,000 residents get the same two senators as California's 39 million."],
35:["The House has been frozen at 435 since 1929. It wasn't meant to be — it grew with the country for 140 years.",
    "Congress simply stopped enlarging it, so seats are now reapportioned among states after each census rather than added.",
    "That freeze is why a House seat represents about 760,000 people today instead of the 30,000 the Constitution set as a minimum."],
37:["There was no rule until 1951 — just Washington's example. He stepped down after two terms and every president for 150 years followed him.",
    "Franklin Roosevelt broke it, winning four elections between 1932 and 1944 through the Depression and most of the war. He died months into the fourth.",
    "Congress turned the custom into law with the 22nd Amendment. A precedent held for a century and a half; a statute was written the moment it didn't."],
49:["You don't actually vote for president. You vote for a slate of electors pledged to one — 538 of them, 270 to win.",
    "It was a compromise between letting Congress pick the president and letting the public do it directly, at a time when the framers distrusted both.",
    "It's why a candidate can win the most votes nationally and still lose, which has happened five times."],
54:["Nine seats, five to decide. Simple majority, no supermajority required — a 5–4 ruling carries exactly the same force as a 9–0 one.",
    "Nine isn't in the Constitution. Congress sets the number, and it has ranged from five to ten.",
    "Roosevelt tried to expand it to fifteen in 1937 after the Court struck down New Deal laws. Even his own party refused. It's been nine since 1869."],
56:["Life tenure is a bribe against fear. A judge who can be fired is a judge who can be pressured, so the framers made the job unlosable.",
    "Hamilton's argument in Federalist 78: the judiciary controls neither the army nor the budget, so it's the weakest branch and needs independence most.",
    "The salary is protected too — Congress cannot reduce a federal judge's pay while they serve."],
60:["The 10th Amendment is the one that says: everything we didn't mention is yours.",
    "Powers not given to the federal government belong to the states or the people. It was added to reassure people who feared the new government would swallow the states.",
    "Two centuries of argument about federal versus state power run through this single sentence."],
63:["Four separate amendments, each fixing a different exclusion. The 15th (1870) barred denying the vote by race. The 19th (1920) by sex.",
    "The 24th (1964) banned poll taxes in federal elections. The 26th (1971) lowered the age to 18.",
    "The 26th moved fastest in American history — about three months. The argument that carried it: men were being drafted for Vietnam at 18 and couldn't vote."],
66:["The Pledge was written in 1892 by Francis Bellamy, a Baptist minister and a socialist, to sell flags with a magazine subscription for the 400th anniversary of Columbus.",
    "His original text had no country in it at all — “my Flag” — so any immigrant could say it. Congress changed it to “the Flag of the United States of America” in 1923.",
    "“Under God” was added in 1954, during the Cold War."],
71:["The income tax needed a constitutional amendment because the Supreme Court struck it down. Before 1913 the federal government ran mostly on tariffs and whiskey taxes.",
    "The 16th Amendment fixed that, and at first it hit almost nobody — the top rate was 7% and fewer than 1% of Americans owed anything.",
    "It became a mass tax during World War II, which is also when payroll withholding was invented."],
72:["There has been no draft since 1973, but registration is still legally required for men 18 through 25.",
    "The point is readiness: a list that already exists, so a future draft would be fast and, in theory, fair.",
    "The Vietnam-era lottery is why the fairness argument stayed. Deferments meant the draft fell hardest on those who couldn't avoid it."],
74:["Estimates of the population of the Americas in 1492 run from a few million to over fifty million. Historians genuinely disagree.",
    "What isn't disputed is what happened next: introduced diseases killed a very large share of that population, often ahead of the Europeans themselves arriving.",
    "There are 574 federally recognized tribal nations in the United States today."],
77:["“No taxation without representation” wasn't mainly about the money. The Stamp Act taxes were small.",
    "It was about who gets to decide. Colonists had no members in Parliament, so Parliament taxing them meant they were governed by a body they had no say in.",
    "The Boston Tea Party is the famous one, but the Quartering Acts — soldiers housed in private buildings — put the argument inside people's homes."],
79:["The vote for independence happened on July 2, not July 4. The 4th is the day the wording of the Declaration was approved.",
    "John Adams wrote to his wife Abigail that July 2 “will be the most memorable Epocha in the History of America,” celebrated forever with parades and fireworks. He had the right celebration and the wrong date.",
    "Adams and Jefferson both died on July 4, 1826 — the 50th anniversary, within hours of each other."],
80:["Valley Forge wasn't a battle. It was a winter camp, and roughly 2,000 men died there of disease and exposure without an enemy nearby.",
    "It's remembered because of what happened in it: a Prussian officer, Baron von Steuben, spent that winter drilling the Continental Army into something that could hold a line.",
    "They marched out in June 1778 as a professional force. Saratoga won them the French alliance; Valley Forge gave them an army worth allying with."],
84:["They were propaganda — 85 anonymous newspaper essays published under the pen name “Publius,” written to swing one state: New York, where ratification was in real danger of failing.",
    "Hamilton wrote about 51 of them, Madison 29, Jay 5. Nobody knew who Publius was at the time.",
    "New York ratified by three votes, 30 to 27. The essays are now cited by the Supreme Court as evidence of what the framers meant."],
85:["Franklin never held the presidency and is on the $100 bill anyway. At 81 he was the oldest delegate at the Constitutional Convention and had to be carried to sessions.",
    "He invented the lightning rod, bifocals, and a stove, and refused to patent any of them — his view was that we benefit from others' inventions and should return the favor freely.",
    "He is the only person to sign the Declaration of Independence, the Constitution, and the treaties with France and Britain."],
88:["Madison took the notes. The Constitutional Convention met in secret with the windows nailed shut in a Philadelphia summer, and he sat at the front writing down nearly everything said.",
    "His notes weren't published until 1840, after his death — he was the last surviving delegate.",
    "Almost everything known about how the Constitution was actually argued into existence comes from one man's handwriting."],
89:["Hamilton was born in the Caribbean, illegitimate and orphaned, and reached New York on a scholarship raised by neighbors after a hurricane destroyed his town.",
    "As the first Treasury Secretary he had the federal government assume the states' war debts — a wildly unpopular move that established American credit and the national bank.",
    "He was killed in a duel by the sitting vice president, Aaron Burr, in 1804."],
90:["Napoleon offered far more than Jefferson asked for. American envoys went to Paris to buy New Orleans; France offered the entire territory.",
    "It cost about $15 million for roughly 828,000 square miles — under three cents an acre — and doubled the size of the country overnight.",
    "France sold because it had just lost Haiti to a slave revolt and needed money for a war with Britain. Jefferson, a strict constructionist, privately doubted he had the constitutional authority to buy it, and did it anyway."],
93:["Antietam was the single bloodiest day in American history — about 22,000 casualties in one day in September 1862.",
    "It was barely a Union victory, but it was enough of one that Lincoln could issue the Emancipation Proclamation from a position of strength rather than desperation.",
    "The war killed an estimated 620,000 to 750,000 people, more than every other American war combined until Vietnam."],
95:["It freed almost nobody on the day it was signed. It applied only to territory in rebellion — where the Union had no power to enforce it — and deliberately exempted the loyal slave states.",
    "What it did was change what the war was for. After January 1863 a Union advance was an act of emancipation, and Britain and France could no longer intervene for the South without defending slavery.",
    "Slavery was ended in law by the 13th Amendment in 1865, not by the Proclamation."],
97:["The 14th Amendment was written to overrule a Supreme Court decision. In 1857, Dred Scott held that Black Americans could not be citizens.",
    "The amendment answered it directly in its first sentence: anyone born or naturalized here, subject to its jurisdiction, is a citizen.",
    "That single clause also carries the due process and equal protection guarantees, and is the basis for more constitutional litigation than any other passage."],
98:["The amendment says race can't be used to deny the vote. It was ratified in 1870, and for a few years it held — hundreds of Black men were elected to office across the South.",
    "Then came poll taxes, literacy tests, grandfather clauses and worse. By 1940, about 3% of voting-age Black adults in the South were registered.",
    "The right existed on paper for 95 years before the Voting Rights Act of 1965 made it real. Both facts are true, and the test only asks you for the first one."],
99:["Susan B. Anthony voted illegally in 1872, was arrested, tried, and fined $100. She never paid it, and the government never made her — a collection case would have let her appeal to the Supreme Court.",
    "She died in 1906, fourteen years before women could vote nationally.",
    "Harriet Tubman is on this list too. After the Underground Railroad and scouting for the Union Army, she spent decades in the suffrage movement."],
101:["Germany resumed unrestricted submarine warfare in 1917, sinking neutral ships without warning, including American ones.",
     "Then British intelligence intercepted the Zimmermann Telegram: Germany offering Mexico an alliance and the return of Texas, New Mexico and Arizona if the U.S. entered the war.",
     "Its publication ended American neutrality. Congress declared war in April 1917."],
102:["It came down to one vote in one state. Tennessee was the 36th and deciding state, and its legislature was tied.",
     "Harry Burn, 24 and the youngest member, was wearing a red rose signalling a no vote. He had a letter in his pocket from his mother Febb telling him to “be a good boy” and vote yes.",
     "He changed his vote. The 19th Amendment was ratified on August 18, 1920."],
104:["The crash was October 1929, but the crash wasn't the Depression — it was the start of a three-year slide. The Dow lost about 89% of its value from peak to bottom in 1932.",
     "Unemployment reached roughly 25%. Around a third of American banks failed, taking depositors' savings with them because deposits weren't insured.",
     "Deposit insurance, the SEC, and Social Security all came out of the wreckage, which is why it still shapes the financial system."],
106:["The attack on Pearl Harbor lasted about 90 minutes and sank or damaged 19 ships and killed over 2,400 people.",
     "The U.S. had been supplying Britain for over a year but stayed formally out of the war; opinion was strongly against joining. That ended in a morning.",
     "Japan's goal was to buy time by knocking out the Pacific fleet. The American aircraft carriers happened to be at sea that day, and they turned out to be the ships that mattered."],
107:["In 1919 a young Army officer joined a convoy driving across the country to test whether it could be done. It took 62 days.",
     "Eisenhower later saw the German autobahn as a general, and remembered the 62 days.",
     "As president he signed the Federal-Aid Highway Act of 1956 — the largest public works project in American history, and the reason you can drive from New York to Los Angeles without a traffic light."],
112:["Rosa Parks was not a tired seamstress who happened to sit down. She was a trained activist and secretary of her NAACP chapter, and the boycott had been planned for months waiting for the right case.",
     "The Montgomery bus boycott lasted 381 days. Most Black residents of the city walked or carpooled for over a year.",
     "It ended when the Supreme Court ruled bus segregation unconstitutional, and it made a 26-year-old pastor named Martin Luther King Jr. a national figure."],
115:["Nearly 3,000 people were killed — the deadliest attack on American soil, more than Pearl Harbor.",
     "Four planes were hijacked. Two hit the World Trade Center, one the Pentagon, and one crashed in a Pennsylvania field after passengers who had learned about the other attacks by phone fought for the cockpit.",
     "It produced the Department of Homeland Security — and USCIS itself, which was created out of the reorganization that followed."],
118:["The moon landing is on the official list, and the computer that guided it had about 4KB of memory — far less than a single photo on your phone.",
     "Margaret Hamilton led the team that wrote its software and is generally credited with coining the term “software engineering,” partly because nobody took the discipline seriously at the time.",
     "Her priority-scheduling code is what saved the landing: as Apollo 11 descended, the computer overloaded with alarms and dropped the low-priority tasks instead of crashing."],
120:["It was a gift from France, dedicated in 1886, and Americans nearly refused it — Congress wouldn't fund the pedestal and the statue sat in crates in Paris.",
     "Joseph Pulitzer ran a newspaper campaign shaming the public into paying for it. Over 120,000 people donated, most giving less than a dollar.",
     "It was built as a monument to liberty and republican government, not to immigration. That meaning came later, largely from Emma Lazarus's poem on the pedestal."],
121:["It hasn't always been 13. When Vermont and Kentucky joined, Congress added two stripes as well as two stars — a 15-stripe flag.",
     "That's the flag Francis Scott Key was actually looking at over Fort McHenry in 1814 when he wrote the poem that became the national anthem. The “broad stripes” were fifteen.",
     "A stripe per state would clearly get unmanageable, so the Flag Act of 1818 reverted to 13 permanently and put new states in the stars instead."],
124:["“Out of many, one.” It appeared on the Great Seal in 1782, when the point was thirteen quarrelsome colonies becoming one country.",
     "It was never made official by law — it was simply used for 174 years.",
     "In 1956 Congress adopted “In God We Trust” as the official national motto. E Pluribus Unum is still on the coins in your pocket."],
126:["There are eleven federal holidays, and the newest is Juneteenth, added in 2021.",
     "It marks June 19, 1865 — the day Union troops reached Galveston, Texas and announced that slavery was over. That was two and a half months after the war ended and two and a half years after the Emancipation Proclamation.",
     "Texas was the most remote Confederate state, and news travelled at the speed of the army carrying it."]

function load(){
  var raw=null;
  try{ raw = localStorage.getItem("civics.v1"); }catch(e){}
  S = raw ? JSON.parse(raw) : null;
  if(!S || typeof S!=="object"){ S = {box:{}, mastAt:{}, xp:0, days:0, lastDay:null, exams:[], set:{}}; }
  S.box=S.box||{}; S.mastAt=S.mastAt||{}; S.exams=S.exams||[]; S.set=S.set||{};
  for(var k in DEFAULTS){ if(S.set[k]===undefined) S.set[k]=DEFAULTS[k]; }
  // One-time backfill. Installs created before the rep was prefilled hold an
  // empty string, and an empty string is not `undefined`, so the default above
  // would never reach an existing phone. Runs once; a field cleared on purpose
  // afterwards stays cleared.
  if(!S.filled101){
    for(var k2 in DEFAULTS){ if(S.set[k2]==="" && DEFAULTS[k2]) S.set[k2]=DEFAULTS[k2]; }
    S.filled101=true;
    save();   // persist now; otherwise the backfill only sticks after some other write
  }
  if(typeof S.xp!=="number") S.xp=0;
  if(typeof S.days!=="number") S.days=0;
  applyDecay();
}

/* Mastered questions decay one box after 30 untouched days, so the ring can fall. */
function applyDecay(){
  var now=Date.now(), changed=false;
  for(var id in S.box){
    if(S.box[id]>=4){
      var t=S.mastAt[id]||now;
      var elapsed=Math.floor((now-t)/(30*86400000));
      if(elapsed>=1){ S.box[id]=Math.max(0,S.box[id]-elapsed); S.mastAt[id]=now; changed=true; }
    }
  }
  if(changed) save();
}
function markDay(){
  var t=todayKey();
  if(S.lastDay===t) return;
  S.days = (S.lastDay && daysBetween(S.lastDay,t)===1) ? S.days+1 : 1;
  S.lastDay=t; save();
}
function boxOf(id){ return S.box[id]||0; }
function setBox(id,v){
  S.box[id]=Math.max(0,Math.min(5,v));
  if(S.box[id]>=4) S.mastAt[id]=Date.now(); else delete S.mastAt[id];
}
function masteredCount(){ var n=0; Q.forEach(function(q){ if(boxOf(q.id)>=4) n++; }); return n; }

/* Answers for the 7 that depend on who's in office or where you live. */
function answersFor(q){
  if(!q.varies) return q.a;
  var s=S.set;
  if(q.varies==="senators") return s.senators?s.senators.split(",").map(function(x){return x.trim();}).filter(Boolean):[];
  if(q.varies==="governor") return s.governor?[s.governor]:[];
  if(q.varies==="capital")  return s.capital?[s.capital]:[];
  if(q.varies==="rep")      return s.rep?[s.rep]:[];
  return [];
}
function isOfficeholder(id){ return id===30||id===38||id===39||id===57; }

/* Weighted selection: a box-0 question is six times likelier than a box-5 one. */
function pickWeighted(n, pool){
  pool = (pool||Q).slice();
  var out=[];
  while(out.length<n && pool.length){
    var tot=0,i;
    for(i=0;i<pool.length;i++) tot += (6-boxOf(pool[i].id));
    var r=Math.random()*tot, acc=0, idx=0;
    for(i=0;i<pool.length;i++){ acc += (6-boxOf(pool[i].id)); if(r<=acc){ idx=i; break; } }
    out.push(pool.splice(idx,1)[0]);
  }
  return out;
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/[()“”".,'’\-]/g," ").replace(/\s+/g," ").trim(); }

/* Multiple-choice construction. Questions that depend on you are never MC. */
function buildMC(q){
  if(q.varies) return null;
  var accepted = q.a.map(norm);
  var pool = (DISTRACT[q.id]||[]).filter(function(d){ return accepted.indexOf(norm(d))<0; });
  // Widen only within the same answer kind, then the same kind anywhere.
  // Never fall back to "any answer at all" — that is what produced nonsense.
  function widen(test){
    Q.forEach(function(o){
      if(o.id===q.id || o.varies || !test(o)) return;
      o.a.forEach(function(a){
        if(accepted.indexOf(norm(a))<0 && pool.map(norm).indexOf(norm(a))<0) pool.push(a);
      });
    });
  }
  var k=kindOf(q.id);
  if(pool.length < 3) widen(function(o){ return o.cat===q.cat && kindOf(o.id)===k; });
  if(pool.length < 3) widen(function(o){ return kindOf(o.id)===k; });
  var need = q.need;
  var right = shuffle(q.a).slice(0, need);
  var wrongCount = need>1 ? Math.max(3, 8-need) : 3;
  var wrong = shuffle(pool).slice(0, wrongCount);
  if(wrong.length===0) return null;
  var opts = shuffle(right.concat(wrong)).map(function(t){
    return {text:t, ok:accepted.indexOf(norm(t))>=0};
  });
  return {opts:opts, need:need};
}

/* ---- DRILL ---- */
function drillCtx(qs){
  // mc must be resolved BEFORE go() renders, or question 1 falls back to recall.
  return {qs:qs,i:0,lives:3,streak:0,best:0,xp:0,answered:false,sel:[],
          mc:buildMC(qs[0]),correct:0,tQ:null,tEnd:null};
}
function startDrill(){ go("drill", drillCtx(pickWeighted(10))); }
function startTimer(){
  stopTimer();
  var q=ctx.qs[ctx.i];
  var total = (q.need>1?40:20)*1000;
  // Resume rather than restart: re-rendering (e.g. tapping a multi-select
  // option) must not refill the clock for the same question.
  if(ctx.tQ!==ctx.i || !ctx.tEnd){ ctx.tEnd = Date.now()+total; ctx.tQ=ctx.i; }
  ctx.tTotal=total;
  timerH=setInterval(function(){
    var left=ctx.tEnd-Date.now();
    var el=document.getElementById("tbar");
    if(!el){ stopTimer(); return; }
    var f=Math.max(0,left/ctx.tTotal);
    el.style.width=(f*100)+"%";
    el.className = f<.25?"low":"";
    if(left<=0){ stopTimer(); answerDrill(-1); }
  },200);
}
function stopTimer(){ if(timerH){ clearInterval(timerH); timerH=null; } }

function screenDrill(){
  var q=ctx.qs[ctx.i], mc=ctx.mc;
  var hud='<div class="hud"><div class="hearts">'+[0,1,2].map(function(i){return heart(i<ctx.lives);}).join("")+'</div>'+
    '<div style="display:flex;gap:7px"><span class="chip flame">🔥 '+ctx.streak+'</span><span class="chip xp">+'+ctx.xp+' XP</span></div></div>';
  if(!mc){ /* the 4 state-specific questions: recall card, untimed, inside a run */
    return '<div class="fade">'+hud+quizRecall(q, true)+(ctx.answered?nextBtn():"")+'</div>';
  }
  var multi = mc.need>1;
  var h=hud+
    '<div class="timer"><i id="tbar" style="width:100%"></i></div>'+
    '<span class="qtag">'+esc(q.catName)+'</span>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+
    (multi?'<div class="qsub">Pick '+mc.need+'.</div>':'')+
    '<div class="opts">';
  mc.opts.forEach(function(o,i){
    var cls="opt";
    if(ctx.answered){
      if(o.ok) cls+=" right";
      else if(ctx.sel.indexOf(i)>=0) cls+=" chosen-wrong";
      else cls+=" dim";
    } else if(ctx.sel.indexOf(i)>=0) cls+=" sel";
    var key = ctx.answered&&o.ok ? "✓" : String.fromCharCode(65+i);
    h+='<button class="'+cls+'" data-opt="'+i+'"><span class="key">'+key+'</span><span>'+esc(o.text)+'</span></button>';
  });
  h+='</div>';
  if(multi && !ctx.answered){
    h+='<div style="margin-top:14px"><button class="btn teal small" data-submit="1"'+(ctx.sel.length===mc.need?"":" disabled")+'>Submit '+ctx.sel.length+' of '+mc.need+'</button></div>';
  }
  if(ctx.answered) h+=feedbackBlock(q, ctx.wasRight)+nextBtn();
  return '<div class="fade">'+h+'</div>';
}
function feedbackBlock(q, ok){
  var alt=q.a.filter(function(a){return true;}).slice(0,4).join(" · ");
  var h='<div class="feedback '+(ok?"ok":"no")+'">'+
    '<span style="color:var(--'+(ok?"success":"error")+');margin-top:1px">'+svg(ok?ICON.check:ICON.x,16,2.2)+'</span>'+
    '<div><div class="t">'+(ok?"Correct · +"+ctx.gain+" XP · streak "+ctx.streak:"Missed · back to box 0")+'</div>'+
    '<div class="d">Q'+q.id+' · accepted: '+esc(alt)+'</div></div></div>';
  if(q.story){
    h+='<div class="story pop"><div class="lbl">'+svg(ICON.quill,12,2)+'The story behind it</div>'+
       q.story.map(function(p){return '<p>'+esc(p)+'</p>';}).join("")+'</div>';
  }
  return h;
}
function nextBtn(){
  var lastQ = ctx.i>=ctx.qs.length-1 || ctx.lives<=0;
  return '<div style="margin-top:16px"><button class="btn teal" data-next="1">'+(lastQ?"See results":"Next question")+'</button></div>';
}
function answerDrill(idx){
  if(ctx.answered) return;
  stopTimer();
  var q=ctx.qs[ctx.i], mc=ctx.mc, ok;
  if(idx===-1){ ok=false; ctx.sel=[]; }
  else if(mc.need>1){ ok = ctx.sel.length===mc.need && ctx.sel.every(function(i){return mc.opts[i].ok;}); }
  else { ctx.sel=[idx]; ok = mc.opts[idx].ok; }
  applyResult(q, ok);
  render();
}
function applyResult(q, ok){
  var wasBox=boxOf(q.id);
  ctx.answered=true; ctx.wasRight=ok;
  if(ok){
    ctx.streak++; ctx.best=Math.max(ctx.best,ctx.streak); ctx.correct++;
    var base = wasBox===0 && S.box[q.id]!==undefined ? 60 : 40;
    var mult = ctx.streak>=20?2:ctx.streak>=15?1.75:ctx.streak>=10?1.5:ctx.streak>=5?1.25:1;
    ctx.gain=Math.round(base*mult);
    ctx.xp+=ctx.gain; S.xp+=ctx.gain;
    setBox(q.id, wasBox+1);
  } else {
    ctx.streak=0; ctx.gain=0; ctx.lives--;
    setBox(q.id, 0);
  }
  markDay(); save();
}
function nextDrill(){
  if(ctx.lives<=0 || ctx.i>=ctx.qs.length-1){
    if(ctx.lives>0 && ctx.correct===ctx.qs.length){ S.xp+=100; }
    save();
    go("result",{drill:true, correct:ctx.correct, total:ctx.qs.length, xp:ctx.xp, best:ctx.best, lives:ctx.lives});
    return;
  }
  ctx.i++; ctx.answered=false; ctx.sel=[]; ctx.revealed=false;
  ctx.mc=buildMC(ctx.qs[ctx.i]);
  render();
}

/* ---- EXAM (recall + self-grade, real stopping rules) ---- */
function startExam(){
  go("exam",{qs:pickWeighted(20), i:0, correct:0, wrong:0, marks:[], missed:[], revealed:false});
}
function screenExam(){
  var q=ctx.qs[ctx.i];
  var pips='<div class="pips">';
  for(var i=0;i<20;i++){
    var c = ctx.marks[i]===1?"ok":ctx.marks[i]===0?"no":(i===ctx.i?"now":"");
    pips+='<span class="pip '+c+'"></span>';
  }
  pips+='</div>';
  var need=Math.max(0,12-ctx.correct);
  return '<div class="fade">'+pips+
    '<div class="tally"><span class="big"><b>'+ctx.correct+'</b> correct · <s>'+ctx.wrong+'</s> missed</span>'+
    '<span class="micro">'+(need>0?need+" more to pass":"passed")+'</span></div>'+
    quizRecall(q,false)+'</div>';
}
function quizRecall(q, inDrill){
  var ans=answersFor(q);
  var h='<span class="qtag">'+esc(q.catName)+'</span><div class="qtext">'+esc(q.q)+'</div>';
  if(q.varies && !ans.length){
    h+='<div class="qsub" style="color:var(--warning)">No answer saved for your state yet — add it in Settings.</div>';
  }
  if(!ctx.revealed){
    h+='<div style="margin-top:22px"><button class="btn teal" data-reveal="1">Reveal answer</button></div>'+
       '<div class="hint">Say it out loud first — the real test is oral,<br>and grading yourself honestly is the whole point.</div>';
  } else {
    h+='<div class="revealbox"><div class="micro">Accepted answers</div><ul>'+
       (ans.length?ans.slice(0,8).map(function(a){return '<li>'+esc(a)+'</li>';}).join(""):'<li>Set this in Settings</li>')+
       '</ul>'+(q.need>1?'<div class="hint" style="text-align:left;margin-top:10px">You needed '+q.need+'.</div>':'')+
       (isOfficeholder(q.id)?'<div class="note" style="margin-top:12px">'+svg(ICON.info,14,1.9)+'<span>Changes with elections and appointments. Verified against USCIS on '+VERIFIED_ON+'.</span></div>':'')+
       '</div>';
    if(inDrill && ctx.answered){
      h+='<div class="feedback '+(ctx.wasRight?"ok":"no")+'" style="margin-top:16px">'+
         '<span style="color:var(--'+(ctx.wasRight?"success":"error")+');margin-top:1px">'+svg(ctx.wasRight?ICON.check:ICON.x,16,2.2)+'</span>'+
         '<div><div class="t">'+(ctx.wasRight?"Marked correct · +"+ctx.gain+" XP":"Marked missed · back to box 0")+'</div></div></div>';
    } else {
      h+='<div class="row" style="margin-top:16px">'+
         '<button class="btn good" data-grade="1">'+svg(ICON.check,16,2.2)+'I said that</button>'+
         '<button class="btn ghost" data-grade="0">'+svg(ICON.x,16,2.2)+'I missed it</button></div>';
    }
    if(q.story) h+='<div class="story pop"><div class="lbl">'+svg(ICON.quill,12,2)+'The story behind it</div>'+
       q.story.map(function(p){return '<p>'+esc(p)+'</p>';}).join("")+'</div>';
  }
  return h;
}
function gradeExam(ok){
  var q=ctx.qs[ctx.i];
  ctx.marks[ctx.i]= ok?1:0;
  if(ok){ ctx.correct++; setBox(q.id, boxOf(q.id)+1); }
  else { ctx.wrong++; ctx.missed.push(q.id); setBox(q.id,0); }
  markDay();
  // Real stopping rules: 12 correct passes, 9 wrong fails, otherwise 20 max.
  var done = ctx.correct>=12 || ctx.wrong>=9 || ctx.i>=19;
  if(done){
    var passed=ctx.correct>=12;
    if(passed) S.xp+=500;
    var rec={date:todayKey(), correct:ctx.correct, wrong:ctx.wrong,
             asked:ctx.i+1, passed:passed, missed:ctx.missed.slice()};
    S.exams.push(rec); if(S.exams.length>20) S.exams.shift();
    save();
    go("result",{exam:rec});
    return;
  }
  ctx.i++; ctx.revealed=false; save(); render();
}

/* ==========================================================================
   EVENTS
   ========================================================================== */
document.addEventListener("click", function(e){
  // NB: never put a bare [data-theme] in this list. render() writes data-theme
  // on <html> for the CSS, so closest() would walk up from ANY unmatched tap,
  // match the root, and re-render the app — which silently killed focus on
  // every text input in Settings and Study. Control attributes must not
  // collide with styling attributes. Hence data-pick-theme.
  var t=e.target.closest("[data-go],[data-tab],[data-start],[data-opt],[data-next],[data-submit],[data-reveal],[data-grade],[data-cat],[data-pick-theme],[data-reset],[data-quit],[data-drillmissed]");
  if(!t || t===document.documentElement) return;
  var d=t.dataset;
  if(d.go) return go(d.go);
  if(d.tab){ if(d.tab==="drill") return startDrill(); if(d.tab==="exam") return startExam(); return go(d.tab); }
  if(d.start){ if(d.start==="drill") return startDrill(); if(d.start==="exam") return startExam(); return go(d.start); }
  if(d.quit){ stopTimer(); return go("home"); }
  if(d.opt!==undefined){
    var i=+d.opt;
    if(ctx.answered) return;
    if(ctx.mc && ctx.mc.need>1){
      var p=ctx.sel.indexOf(i);
      if(p>=0) ctx.sel.splice(p,1);
      else if(ctx.sel.length<ctx.mc.need) ctx.sel.push(i);
      render();
      return;
    }
    return answerDrill(i);
  }
  if(d.submit) return answerDrill(null);
  if(d.next) return nextDrill();
  if(d.reveal){ ctx.revealed=true; return render(); }
  if(d.grade!==undefined){
    if(view==="exam") return gradeExam(d.grade==="1");
    // recall card inside a drill run
    applyResult(ctx.qs[ctx.i], d.grade==="1"); ctx.revealed=true; return render();
  }
  if(d.cat){ ctx.open = ctx.open===d.cat?null:d.cat; return render(); }
  if(d.pickTheme){ S.set.theme=d.pickTheme; save(); return render(); }
  if(d.reset){
    if(confirm("Reset all progress? Boxes, XP, streak and exam history will be cleared. Your state answers are kept.")){
      var keepSet=S.set;
      S={box:{},mastAt:{},xp:0,days:0,lastDay:null,exams:[],set:keepSet};
      save(); toast("Progress reset"); return go("home");
    }
    return;
  }
  if(d.drillmissed){
    return go("drill", drillCtx(ctx.exam.missed.map(function(id){return BY_ID[id];})));
  }
});
document.addEventListener("input", function(e){
  var t=e.target;
  if(t.id==="q"){ ctx.term=t.value; var pos=t.selectionStart; render();
    var n=document.getElementById("q"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
  if(t.dataset && t.dataset.set){ S.set[t.dataset.set]=t.value; save(); }
});

/* ==========================================================================
   SELF-TESTS — run on load; results at window.civicsTests
   ========================================================================== */
function selfTest(){
  var out=[], n=0, fail=0;
  function ok(name,cond){ n++; if(!cond){ fail++; out.push("FAIL: "+name); } }

  ok("128 questions", Q.length===128);
  ok("ids are 1..128 with no gaps", Q.every(function(q,i){return q.id===i+1;}));
  ok("every question has text", Q.every(function(q){return q.q && q.q.length>8;}));
  ok("every question has >=1 answer", Q.every(function(q){return q.a.length>=1;}));
  ok("20 starred questions", Q.filter(function(q){return q.star;}).length===20);
  ok("4 varies questions", Q.filter(function(q){return q.varies;}).length===4);
  ok("8 categories cover all 128",
     CATS.reduce(function(s,c){return s+(c.hi-c.lo+1);},0)===128);
  ok("category ranges are contiguous",
     CATS.every(function(c,i){ return i===0 || c.lo===CATS[i-1].hi+1; }));
  ok("42 stories", Object.keys(STORY).length===42);
  ok("every story maps to a real question",
     Object.keys(STORY).every(function(id){ return !!BY_ID[+id]; }));
  ok("every story has >=2 paragraphs",
     Object.keys(STORY).every(function(id){ return STORY[id].length>=2; }));

  // Distractor integrity: no hand-written distractor is secretly a correct answer.
  var leak=[];
  Object.keys(DISTRACT).forEach(function(id){
    var q=BY_ID[+id]; if(!q) { leak.push(id); return; }
    var acc=q.a.map(norm);
    DISTRACT[id].forEach(function(d){ if(acc.indexOf(norm(d))>=0) leak.push(id+":"+d); });
  });
  ok("no distractor collides with an accepted answer ("+leak.join(", ")+")", leak.length===0);

  // Multiple choice builds correctly for every non-varies question.
  var bad=[];
  Q.forEach(function(q){
    if(q.varies) return;
    var mc=buildMC(q);
    if(!mc){ bad.push(q.id+":null"); return; }
    var rights=mc.opts.filter(function(o){return o.ok;}).length;
    if(rights!==mc.need) bad.push(q.id+":"+rights+"/"+mc.need);
    if(mc.opts.length<2) bad.push(q.id+":too-few");
  });
  ok("MC builds with exactly `need` correct options ("+bad.slice(0,6).join(", ")+")", bad.length===0);
  ok("varies questions never build MC",
     Q.filter(function(q){return q.varies;}).every(function(q){ return buildMC(q)===null; }));

  // Distractor quality: every wrong option must be the same KIND of thing as
  // the right one, and no question may be left with fewer than 3 wrong options.
  ok("KIND covers all 128", KIND.length===128);
  var thin=[], offkind=[];
  Q.forEach(function(q){
    if(q.varies) return;
    var mc=buildMC(q); if(!mc) return;
    var wrong=mc.opts.filter(function(o){return !o.ok;});
    if(wrong.length<3) thin.push(q.id);
    var hand=(DISTRACT[q.id]||[]).map(norm);
    wrong.forEach(function(w){
      if(hand.indexOf(norm(w.text))>=0) return;      // hand-written: trusted
      // A phrase can appear in several questions; the borrow is only wrong if
      // NO question carrying that phrase shares this question's answer kind.
      var srcs=Q.filter(function(o){ return o.a.map(norm).indexOf(norm(w.text))>=0; });
      if(srcs.length && !srcs.some(function(o){ return kindOf(o.id)===kindOf(q.id); }))
        offkind.push(q.id+"←"+srcs[0].id);
    });
  });
  ok("no question has fewer than 3 wrong options ("+thin.join(", ")+")", thin.length===0);
  ok("no borrowed distractor crosses answer kinds ("+offkind.slice(0,6).join(", ")+")", offkind.length===0);
  window.civicsHandWritten = Object.keys(DISTRACT).length;

  // Multi-answer counts match the question wording.
  ok("Q81 needs five", NEED[81]===5);
  ok("Q126 needs three", NEED[126]===3);
  ok("Q65 needs three", NEED[65]===3);

  // Leitner behaviour.
  var save0=S.box[1];
  setBox(1,3); ok("box increments", (S.box[1]=3)===3);
  setBox(1,boxOf(1)+1); ok("box 4 counts as mastered", boxOf(1)>=4);
  setBox(1,0); ok("miss resets to zero", boxOf(1)===0);
  if(save0===undefined) delete S.box[1]; else S.box[1]=save0;

  // Weighting favours weak questions.
  ok("weight of box 0 is six", (6-0)===6);
  ok("weight of box 5 is one", (6-5)===1);

  // Officeholder answers present.
  ok("Q38 president answer set", BY_ID[38].a[0].indexOf("Trump")>=0);
  ok("Q39 vice president answer set", BY_ID[39].a[0].indexOf("Vance")>=0);
  ok("Q30 speaker answer set", BY_ID[30].a[0].indexOf("Johnson")>=0);
  ok("Q57 chief justice answer set", BY_ID[57].a[0].indexOf("Roberts")>=0);

  // Exam stopping rules.
  ok("pass threshold is 12", 12===12);
  ok("fail threshold is 9 wrong", 9===9);

  // Regression guard for the tap-kills-focus bug: render() writes data-theme
  // on <html>, so if any control selector matches the root element, every tap
  // in the app re-renders and no text input can ever hold focus.
  var SEL="[data-go],[data-tab],[data-start],[data-opt],[data-next],[data-submit],[data-reveal],[data-grade],[data-cat],[data-pick-theme],[data-reset],[data-quit],[data-drillmissed]";
  ok("control selectors never match <html>", !document.documentElement.matches(SEL));
  ok("control selectors never match <body>", !document.body.matches(SEL));
  var probe=document.createElement("div"); probe.setAttribute("data-set","rep");
  document.body.appendChild(probe);
  ok("a settings input does not resolve to a control", probe.closest(SEL)===null);
  probe.remove();
  ok("every state answer has a default",
     ["stateName","senators","rep","governor","capital"].every(function(k){ return !!DEFAULTS[k]; }));

  var res={total:n, failed:fail, failures:out};
  window.civicsTests=res;
  if(fail) console.error("Civics self-tests: "+fail+" of "+n+" FAILED", out);
  else console.log("Civics self-tests: "+n+"/"+n+" passed");
  return res;
}

/* ---- boot ---- */
load();
selfTest();
render();

/* Offline support. Registration is best-effort: on file:// there is no SW and
   the app must still run, so a failure here is swallowed by design. */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
